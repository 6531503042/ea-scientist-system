services:
  # ===========================================================================
  # 🗄️ PostgreSQL - Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ea-system-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ea_system}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # 🛠️ pgAdmin - Database Management UI
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ea-system-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ===========================================================================
  # 🔄 Database Migration & Seed (runs once, then exits)
  # ===========================================================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: ea-system-migrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ea_system}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ===========================================================================
  # 🚀 Next.js Application
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ea-system-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ea_system}?schema=public
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/signatures:/app/public/signatures
      - ./file/uploads:/app/file/uploads

volumes:
  postgres_data:
  pgadmin_data:
